stages:
  - build
  - test
  - lint

default:
  # OpenJDK images have been deprecated
  image: maven:3.9-eclipse-temurin-25-noble

# BEGIN Tooling setup
.prepare_checkstyle: &prepare_checkstyle
    - |
      mkdir -p .cache/checkstyle
      if [ ! -f .cache/checkstyle/checkstyle.jar ]; then
        curl -L -o .cache/checkstyle/checkstyle.jar "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-14.3.0/checkstyle-14.3.0-all.jar";
      fi
      # Write the checkstyle config to a shared cache in case it's not there
      if [ ! -f .cache/checkstyle/checkstyle.xml ]; then
        echo '<?xml version="1.0"?>
        <!DOCTYPE module PUBLIC
            "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN"
            "https://checkstyle.org/dtds/configuration_1_3.dtd">

        <module name="Checker">
            <property name="charset" value="UTF-8"/>

            <module name="TreeWalker">
                <module name="TypeName"/>
                <module name="MethodName"/>
                <module name="ParameterName"/>
                <module name="LocalVariableName"/>
                <module name="MemberName"/>
                <module name="PackageName"/>

                <module name="Indentation">
                    <property name="basicOffset" value="4"/>
                    <property name="braceAdjustment" value="0"/>
                    <property name="caseIndent" value="4"/>
                    <property name="tabWidth" value="4"/>
                </module>
            </module>
        </module>' > .cache/checkstyle/checkstyle.xml;
      fi

.prepare_tests: &prepare_tests
    - |
      mkdir -p .cache/tests
      if [ ! -f .cache/tests/tests.jar ]; then
        # This needs to be updated whenever the test tool version changes
        curl -L -o .cache/tests/tests.jar "https://gitlab.ibr.cs.tu-bs.de/prog1/ws2627/abgaben/testfile/-/raw/master/Prog1Tests-2.0.1-all.jar?inline=false";
      fi
# END Tooling setup

# BEGIN Build stages (all stage: build tasks run at the same time)
# This can probably be rewritten to use run steps, but those aren't stable yet
compile_blatt_1:
  stage: build
  # Only execute runner when this exercise has changes
  rules:
    # Only run on the default branch (aka main)
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - changes:
        paths:
          - blatt1/**/*.java
  script:
    - javac -cp blatt1/pflichtaufgabe3/ blatt1/pflichtaufgabe3/Main.java;
    - echo "Pflichtaufgabe 3 Compiled";
    - javac -cp blatt1/pflichtaufgabe4/ blatt1/pflichtaufgabe4/Main.java;
    - echo "Pflichtaufgabe 4 Compiled";
  artifacts:
    paths:
      - blatt1/**/*
    exclude:
      - blatt1/**/*.java
    expire_in: 20 minutes

