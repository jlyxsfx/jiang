test_blatt_1_aufgabe_3:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - changes:
        paths:
          - blatt1/pflichtaufgabe3/**/*.java
  cache:
    # Change the cache key on all test runs if the test tool version changes
    # This is to invalidate the cache!
    key: "prog-1-tests-shared_v1.7"
    paths:
      - .cache/tests/tests.jar
    policy: pull-push
  script:
    #- *prepare_tests
    - java -jar .cache/tests/tests.jar blatt1/pflichtaufgabe3/ 1 3
  needs:
    - job: compile_blatt_1
      artifacts: true

