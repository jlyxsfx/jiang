# BEGIN Lint stages (these can fail without failing the full pipeline)
lint_blatt_1:
  stage: lint
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - changes:
        paths:
          - blatt1/**/*.java
  cache:
    key: "prog-1-checkstyle-shared"
    paths:
      - .cache/checkstyle/checkstyle.jar
      - .cache/checkstyle/checkstyle.xml
    policy: pull-push
  # Allow lints to fail without failing the pipeline
  allow_failure: true
  script:
    - *prepare_checkstyle
    - java -jar .cache/checkstyle/checkstyle.jar -c .cache/checkstyle/checkstyle.xml $(find blatt1/pflichtaufgabe3 -name "*.java")
    - echo "Lint done for Pflichtaufgabe 3";
